[package]
name = "vocabulary-hub-rs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Builds a static, content-negotiated publication (Turtle, JSON-LD, HTML) and DCAT catalog of versioned RDF vocabularies from a plain directory convention."
publish = false

[dependencies]
# Pinned to an exact commit: the served files are a function of this crate's
# serializers, so "which rdf-sitegen built this site" must have one answer.
rdf-sitegen = { git = "https://github.com/ds-labs-org/ds-rdf-sitegen-rs.git", rev = "ee86c1d14c182f696e3cb7bdb571910f32a9ad10" }
oxttl = "0.2.4"
oxrdf = "0.3.4"
# The HTML representation is rendered server-side, to static files, with a
# small set of local Yew components styled by the configured stylesheets.
yew = { version = "0.23", features = ["ssr"] }
tokio = { version = "1", features = ["rt"] }
# Consumers parse expanded JSON-LD with serde_json and preserve_order: key order is display order.
serde_json = { version = "1", features = ["preserve_order"] }
oxrdfxml = "0.2"

[dev-dependencies]
tempfile = "3"
oxjsonld = "0.2.6"
