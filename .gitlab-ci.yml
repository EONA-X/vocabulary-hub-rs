# Generic gates for this repo's own fixtures: fmt -> clippy -> test. No
# content submodule, no UI build, no deploy job: those only exist in a real
# instantiation's own CI (its own branding/content/hosting choices), not in
# this agnostic vocabulary hub.
#
# An instantiation that deploys this software typically builds its own
# .gitlab-ci.yml on top of this one, adding jobs that call scripts/*.sh (and,
# for the dev-preview pattern, scripts/examples/dev-root.sh +
# hosting/examples/, filled in -- see hosting/examples/README.md) against its
# own content and hosts.

variables:
  RUST_IMAGE: "rust:bookworm"
  CARGO_TERM_COLOR: always
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  # Keep the cached target/ small: incremental state is never reused from a
  # fresh checkout, and line-tables-only keeps file:line in test backtraces
  # without 40-50 MB full-debuginfo test binaries (~26% smaller, same speed).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"

# A GitLab pipeline schedule (CI/CD > Schedules) must be created in the UI:
# it re-runs `deny` so a new RUSTSEC advisory against an unchanged lockfile
# is caught.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_COMMIT_TAG'

stages:
  - gates

.rust:
  image: $RUST_IMAGE
  cache:
    key:
      # Per-job prefix: clippy and test build different artifacts and would
      # otherwise overwrite each other's archive.
      prefix: $CI_JOB_NAME
      files: [Cargo.lock]
    paths: [.cargo/registry, .cargo/git, target]

fmt:
  extends: .rust
  stage: gates
  cache: [] # builds nothing, no need to pull or push target/
  script:
    - rustup component add rustfmt
    - cargo fmt --check

clippy:
  extends: .rust
  stage: gates
  script:
    - rustup component add clippy
    - cargo clippy --all-targets --locked -- -D warnings

test:
  extends: .rust
  stage: gates
  script:
    - cargo test --locked

deny:
  extends: .rust
  stage: gates
  script:
    - cargo install cargo-deny --locked
    - cargo deny --locked check
