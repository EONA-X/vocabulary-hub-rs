# bump (on demand) -> gates -> build -> hosting -> deploy.
#
# `public/` from `build` is the publication. `hosting` serves it in the three
# layouts it will live in (bare, dev-voc.eona-x.eu, eona-x.eu behind WordPress)
# from a stock httpd:2.4. On main, `deploy:dev` mirrors it into dev-voc's voc/
# folder and adds dev-voc's root files (scripts/dev-root.sh), then
# `deploy:prd` — manual — adds it to eona-x.eu's voc/ folder (additive: a
# published version is never deleted). Each environment has its own SFTP
# account, rooted at its web root; OVH_SFTP_USER/PASSWORD/DIR are scoped per
# GitLab environment. Each deploy ends with the same content-negotiation
# check, against the live URL.
#
# Accounts, domains and the CI variables the deploy jobs read are set up by
# hand once, per the eona-x.eu OVH web hosting deployment guide in
# eona-architecture-decision-records.

variables:
  RUST_IMAGE: "rust:bookworm"
  # content/ (content.vocabulary-hub.eona-x.eu) is itself a submodule host:
  # the vocabularies live one level further down, in content/vocabularies.
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  CARGO_TERM_COLOR: always
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - bump
  - gates
  - build
  - hosting
  - deploy

# On demand, on main: move content/ to content.vocabulary-hub.eona-x.eu's
# latest main, and commit and push that if it changed. The push to main starts
# a new pipeline, which builds from the new content and redeploys dev (prd stays
# manual). Pushes with the CI job token as the user who runs the job, so only
# someone allowed to push to the protected main (a Maintainer) can complete it;
# requires "Allow Git push requests to the repository" in this project's
# CI/CD job token settings.
bump:content:
  stage: bump
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - apk add --no-cache git >/dev/null
    - content_url="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/eona-x/semantic-hub/content.vocabulary-hub.eona-x.eu.git"
    - git -c "submodule.content.url=$content_url" submodule update --init content
    - git -C content fetch -q "$content_url" main
    - old=$(git rev-parse HEAD:content)
    - new=$(git -C content rev-parse FETCH_HEAD)
    - 'if [ "$old" = "$new" ]; then echo "content is already at the latest main ($old)"; exit 0; fi'
    - git -C content checkout -q "$new"
    - incoming=$(git -C content log --oneline "$old..$new")
    - echo "$incoming"
    - git config user.name "$GITLAB_USER_NAME"
    - git config user.email "$GITLAB_USER_EMAIL"
    - git add content
    - 'git commit -q -m "chore: bump content to $(git -C content rev-parse --short HEAD)" -m "Latest main of content.vocabulary-hub.eona-x.eu, from the on-demand bump:content job (pipeline $CI_PIPELINE_ID):" -m "$incoming"'
    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:$CI_DEFAULT_BRANCH"

.rust:
  image: $RUST_IMAGE
  cache:
    key:
      files: [Cargo.lock]
    paths: [.cargo/registry, .cargo/git, target]

fmt:
  extends: .rust
  stage: gates
  script:
    - rustup component add rustfmt
    - cargo fmt --check

clippy:
  extends: .rust
  stage: gates
  script:
    - rustup component add clippy
    - cargo clippy --all-targets --locked -- -D warnings

test:
  extends: .rust
  stage: gates
  script:
    - cargo test --locked

build:
  extends: .rust
  stage: build
  script:
    - cargo run --release --locked -- content/vocabularies public
    # The acceptance tree adds a fixture vocabulary, so the hosting layouts
    # are exercised even while nothing upstream is minted under eona-x.eu.
    - cargo run --release --locked -- tests/fixtures/vocabularies acceptance-site
    - cp -r public/. acceptance-site/
  artifacts:
    paths: [public, acceptance-site]
    expire_in: 1 week

hosting:
  stage: hosting
  image: httpd:2.4
  needs: [build]
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - sh scripts/hosting-acceptance.sh acceptance-site

.deploy:
  stage: deploy
  image: debian:bookworm-slim
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - apt-get update -qq && apt-get install -qq -y lftp openssh-client curl >/dev/null
    # GitLab drops an empty public/ from the artifacts when nothing is published.
    - mkdir -p public
    # This pipeline's own publication only ever goes to a voc/ folder.
    - 'case "${OVH_SFTP_DIR:-}" in voc|*/voc) ;; *) echo "OVH_SFTP_DIR=${OVH_SFTP_DIR:-<unset>} is not a voc/ folder" >&2; exit 1 ;; esac'

deploy:dev:
  extends: .deploy
  needs: [build, hosting]
  environment:
    name: dev
    url: https://dev-voc.eona-x.eu/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - sh scripts/deploy-sftp.sh public mirror
    # Then the web root's own files (dev overlay + router, robots.txt), added
    # next to voc/ and the Hub UI build without deleting anything there.
    - sh scripts/dev-root.sh dev-root
    - OVH_SFTP_DIR=. sh scripts/deploy-sftp.sh dev-root additive
    - sh scripts/smoke-live.sh "$CI_ENVIRONMENT_URL" public
    - "curl -sf https://dev-voc.eona-x.eu/robots.txt | grep -qx 'Disallow: /'"

deploy:prd:
  extends: .deploy
  needs: [build, hosting, "deploy:dev"]
  environment:
    name: prd
    url: https://eona-x.eu/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - sh scripts/deploy-sftp.sh public additive
    - sh scripts/smoke-live.sh "$CI_ENVIRONMENT_URL" public
