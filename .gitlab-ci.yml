# bump (on demand) -> gates -> build -> hosting -> deploy.
#
# `ui` builds the Vocabulary Hub UI (the `ui/` submodule, eona-vocabulary-ui)
# with the catalog data `build` writes to `docs/`; `deploy:dev` puts it at
# dev-voc's root (`deploy:prd-vocabulary`: vocabulary.eona-x.eu's), next to
# the vocabularies' voc/ folder and the root files, which it never touches.
#
# `public/` from `build` is the publication, one tree per production host:
# public/eona-x.eu (Eona-X-authored vocabularies) and
# public/vocabulary.eona-x.eu (vendored standards). `hosting` serves them in
# the layouts they will live in (bare, dev-voc.eona-x.eu, eona-x.eu behind
# WordPress, vocabulary.eona-x.eu) from a stock httpd:2.4. On main,
# `deploy:dev` mirrors both trees, merged, into dev-voc's voc/ folder and adds
# dev-voc's root files (scripts/dev-root.sh); then — manual — `deploy:prd`
# adds public/eona-x.eu to eona-x.eu's voc/ folder and `deploy:prd-vocabulary`
# adds public/vocabulary.eona-x.eu to vocabulary.eona-x.eu's (additive: a
# published version is never deleted). Each environment has its own SFTP
# account, rooted at its web root; OVH_SFTP_USER/PASSWORD/DIR are scoped per
# GitLab environment. Each deploy ends with the same content-negotiation
# check, against the live URL.
#
# Accounts, domains and the CI variables the deploy jobs read are set up by
# hand once, per the eona-x.eu OVH web hosting deployment guide in
# eona-architecture-decision-records.

variables:
  RUST_IMAGE: "rust:bookworm"
  # content/ (content.vocabulary-hub.eona-x.eu) is itself a submodule host:
  # the vocabularies live one level further down, in content/vocabularies.
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  CARGO_TERM_COLOR: always
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - bump
  - gates
  - build
  - hosting
  - deploy

# ON DEMAND: publish the latest vocabularies. One click on the manual `bump`
# job of a main pipeline starts a chain, each project bumping itself (a CI job
# token may only push to its own project), all as the user who clicked:
#   1. `bump` triggers a pipeline in content.vocabulary-hub.eona-x.eu, whose
#      bump:vocabularies job moves vocabularies/ to eona-vocabularies-reference
#      main and pushes if it changed, then triggers a pipeline here with
#      BUMP_CONTENT=true;
#   2. that pipeline runs only `bump:content`: content/ moves to the content
#      repository's latest main, committed and pushed to main if it changed;
#   3. the push starts the ordinary main pipeline, which rebuilds and
#      redeploys dev (prd stays manual).
# Pushes use the CI job token as the user who clicked, so only someone allowed
# to push to the protected main branches (a Maintainer) can complete it; both
# projects have "Allow Git push requests to the repository" enabled.
bump:
  stage: bump
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "pipeline" && $BUMP_CONTENT != "true"'
      when: manual
      allow_failure: true
  variables:
    BUMP_VOCABULARIES: "true"
  trigger:
    project: eona-x/semantic-hub/content.vocabulary-hub.eona-x.eu
    branch: main

bump:content:
  stage: bump
  image: alpine:3.20
  rules:
    - if: '$BUMP_CONTENT == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - apk add --no-cache git >/dev/null
    - content_url="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/eona-x/semantic-hub/content.vocabulary-hub.eona-x.eu.git"
    - git -c "submodule.content.url=$content_url" submodule update --init content
    - git -C content fetch -q "$content_url" main
    - old=$(git rev-parse HEAD:content)
    - new=$(git -C content rev-parse FETCH_HEAD)
    - 'if [ "$old" = "$new" ]; then echo "content is already at the latest main ($old)"; exit 0; fi'
    - git -C content checkout -q "$new"
    - incoming=$(git -C content log --oneline "$old..$new")
    - echo "$incoming"
    - git config user.name "$GITLAB_USER_NAME"
    - git config user.email "$GITLAB_USER_EMAIL"
    - git add content
    - 'git commit -q -m "chore: bump content to $(git -C content rev-parse --short HEAD)" -m "Latest main of content.vocabulary-hub.eona-x.eu, from the on-demand bump (pipeline $CI_PIPELINE_ID):" -m "$incoming"'
    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:$CI_DEFAULT_BRANCH"

.rust:
  image: $RUST_IMAGE
  rules:
    - if: '$BUMP_CONTENT == "true"'
      when: never
    - when: on_success
  cache:
    key:
      files: [Cargo.lock]
    paths: [.cargo/registry, .cargo/git, target]

fmt:
  extends: .rust
  stage: gates
  script:
    - rustup component add rustfmt
    - cargo fmt --check

clippy:
  extends: .rust
  stage: gates
  script:
    - rustup component add clippy
    - cargo clippy --all-targets --locked -- -D warnings

test:
  extends: .rust
  stage: gates
  script:
    - cargo test --locked

build:
  extends: .rust
  stage: build
  script:
    # public/: the vocabularies; docs/: the Hub UI's catalog data.
    - BUILT_AT="$CI_COMMIT_TIMESTAMP" cargo run --release --locked -- content/vocabularies public docs
    # The acceptance tree adds two fixture vocabularies, one per host, so every
    # hosting layout is exercised whatever upstream publishes.
    - cargo run --release --locked -- tests/fixtures/vocabularies acceptance-site
    - cp -r public/. acceptance-site/
  artifacts:
    paths: [public, docs, acceptance-site]
    expire_in: 1 week

ui:
  stage: build
  needs: [build]
  # eona-vocabulary-ui's own pins (its Dockerfile and publish workflow).
  image: rust:1.97.1-bookworm
  variables:
    TRUNK_VERSION: 0.22.0-beta.2
    WASM_BINDGEN_VERSION: 0.2.127
  rules:
    - if: '$BUMP_CONTENT == "true"'
      when: never
    - when: on_success
  cache:
    key: ui-$TRUNK_VERSION-$WASM_BINDGEN_VERSION
    paths: [.cargo/bin, .cargo/registry, .cargo/git, ui/target]
  script:
    - rustup target add wasm32-unknown-unknown
    # The release binaries (seconds, where `cargo install trunk` takes ~15 min),
    # cached in .cargo/bin; built from source only if the download fails.
    - export PATH="$CARGO_HOME/bin:$PATH" && mkdir -p "$CARGO_HOME/bin"
    - get() { curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 "$1" | tar -xz -C "$2"; }
    - |
      if ! trunk --version 2>/dev/null | grep -qF "$TRUNK_VERSION"; then
        get "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/trunk-x86_64-unknown-linux-musl.tar.gz" "$CARGO_HOME/bin" \
          || cargo install "trunk@$TRUNK_VERSION" --locked
      fi
    - |
      if ! wasm-bindgen --version 2>/dev/null | grep -qF "$WASM_BINDGEN_VERSION"; then
        w=wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl
        { get "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$w.tar.gz" /tmp && cp /tmp/$w/wasm-bindgen "$CARGO_HOME/bin/"; } \
          || cargo install "wasm-bindgen-cli@$WASM_BINDGEN_VERSION" --locked
      fi
    - trunk --version && wasm-bindgen --version
    # Served at the web root: every link and fetch is relative to "/".
    - cd ui && ./build.sh ../docs /
  artifacts:
    paths: [ui/dist]
    expire_in: 1 week

hosting:
  stage: hosting
  image: httpd:2.4
  needs: [build]
  rules:
    - if: '$BUMP_CONTENT == "true"'
      when: never
    - when: on_success
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - sh scripts/hosting-acceptance.sh acceptance-site

.deploy:
  stage: deploy
  image: debian:bookworm-slim
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - apt-get update -qq && apt-get install -qq -y lftp openssh-client curl >/dev/null
    # GitLab drops an empty tree from the artifacts when nothing is published.
    - mkdir -p public/eona-x.eu public/vocabulary.eona-x.eu
    # This pipeline's own publication only ever goes to a voc/ folder.
    - 'case "${OVH_SFTP_DIR:-}" in voc|*/voc) ;; *) echo "OVH_SFTP_DIR=${OVH_SFTP_DIR:-<unset>} is not a voc/ folder" >&2; exit 1 ;; esac'

deploy:dev:
  extends: .deploy
  needs: [build, ui, hosting]
  environment:
    name: dev
    url: https://dev-voc.eona-x.eu/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $BUMP_CONTENT != "true"'
  script:
    # The Hub UI at the web root: mirrored, but never voc/ nor the root files.
    - OVH_SFTP_DIR=. sh scripts/deploy-sftp.sh ui/dist site
    # dev-voc previews both hosts: their trees, merged (the build refuses a
    # path on both).
    - mkdir -p dev-site && cp -r public/eona-x.eu/. public/vocabulary.eona-x.eu/. dev-site/
    - sh scripts/deploy-sftp.sh dev-site mirror
    # Then the web root's own files (dev overlay + router, robots.txt), added
    # next to voc/ and the Hub UI build without deleting anything there.
    - sh scripts/dev-root.sh dev-root
    - OVH_SFTP_DIR=. sh scripts/deploy-sftp.sh dev-root additive
    - sh scripts/smoke-live.sh "$CI_ENVIRONMENT_URL" public/eona-x.eu
    - sh scripts/smoke-live.sh "$CI_ENVIRONMENT_URL" public/vocabulary.eona-x.eu
    # dev-voc must never be indexed: crawlers may fetch it (robots.txt), and every
    # response says noindex.
    - "curl -sfI https://dev-voc.eona-x.eu/ | grep -qi '^x-robots-tag: noindex'"
    # The Hub UI: its shell at the root and on its pages, its catalog data.
    - "curl -sf https://dev-voc.eona-x.eu/ | grep -q 'eovoc-ui-'"
    - "curl -sf 'https://dev-voc.eona-x.eu/ontologies?ontology=netex' | grep -q 'eovoc-ui-'"
    # catalog.jsonld is the one large (~120KB) response in this script; it
    # occasionally drops mid-transfer this late into the job's connection
    # count, with no sign of it being a real deploy defect (retrying alone
    # always passes) — so retry a few times before failing the job.
    - |
      i=0
      until curl -sf https://dev-voc.eona-x.eu/docs/catalog.jsonld | grep -qF 'https://vocabulary.eona-x.eu/catalog'; do
        i=$((i + 1))
        [ "$i" -ge 5 ] && { echo "docs/catalog.jsonld check failed after $i attempts" >&2; exit 1; }
        sleep 5
      done

deploy:prd:
  extends: .deploy
  needs: [build, hosting, "deploy:dev"]
  environment:
    name: prd
    url: https://eona-x.eu/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $BUMP_CONTENT != "true"'
      when: manual
  script:
    - sh scripts/deploy-sftp.sh public/eona-x.eu additive
    - sh scripts/smoke-live.sh "$CI_ENVIRONMENT_URL" public/eona-x.eu

deploy:prd-vocabulary:
  extends: .deploy
  needs: [build, ui, hosting, "deploy:dev"]
  environment:
    name: prd-vocabulary
    url: https://vocabulary.eona-x.eu/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $BUMP_CONTENT != "true"'
      when: manual
  script:
    - OVH_SFTP_DIR=. sh scripts/deploy-sftp.sh ui/dist site
    - sh scripts/deploy-sftp.sh public/vocabulary.eona-x.eu additive
    - sh scripts/smoke-live.sh "$CI_ENVIRONMENT_URL" public/vocabulary.eona-x.eu
